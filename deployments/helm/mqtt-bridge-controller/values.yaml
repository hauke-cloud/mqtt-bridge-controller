# Default values for mqtt-bridge-controller.

replicaCount: 1

image:
  repository: ghcr.io/hauke-cloud/mqtt-bridge-controller
  pullPolicy: IfNotPresent
  tag: ""  # defaults to .Chart.AppVersion

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# ─── Controller configuration ────────────────────────────────────────────────
controller:
  # Log level: debug, info, warn, error
  logLevel: info

  # Enable leader election (required when running >1 replica)
  leaderElect: false

  # Address for the controller-runtime Prometheus metrics endpoint.
  # This is separate from the REST API /metrics endpoint.
  metricsAddr: ":8080"

  # Health probe address (used by liveness/readiness probes).
  probeAddr: ":8081"

# ─── REST API ─────────────────────────────────────────────────────────────────
api:
  # Bind address for the REST API and Prometheus /metrics endpoint.
  addr: ":8443"

# ─── mTLS configuration ───────────────────────────────────────────────────────
# The REST API enforces mutual TLS when tls.enabled=true and tls.ca is set.
# Clients must present a certificate signed by the CA in tls.ca.
#
# How to generate self-signed certs for development:
#
#   # CA key + cert
#   openssl req -x509 -newkey rsa:4096 -keyout ca.key -out ca.crt \
#     -days 3650 -nodes -subj "/CN=mqtt-bridge-ca"
#
#   # Server key + cert (signed by CA)
#   openssl req -newkey rsa:4096 -keyout server.key -out server.csr \
#     -nodes -subj "/CN=mqtt-bridge-controller"
#   openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
#     -CAcreateserial -out server.crt -days 365
#
#   # Client key + cert (signed by CA)
#   openssl req -newkey rsa:4096 -keyout client.key -out client.csr \
#     -nodes -subj "/CN=api-client"
#   openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key \
#     -CAcreateserial -out client.crt -days 365
#
tls:
  enabled: true

  # Existing secret with keys: tls.crt, tls.key, ca.crt
  # If set, the chart will NOT create the secret (bring-your-own).
  existingSecret: ""

  # Provide cert/key/CA inline (base64-encoded PEM). Used when existingSecret=""
  # Leave empty strings to skip inline secret creation.
  crt: ""   # base64-encoded server certificate PEM
  key: ""   # base64-encoded server private key PEM
  ca: ""    # base64-encoded CA certificate PEM (used for mTLS client verification)

  # Mount path inside the container.
  mountPath: /tls

# ─── Service ─────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  # REST API port (exposed externally)
  apiPort: 8443
  # Metrics port (controller-runtime, usually internal only)
  metricsPort: 8080

# ─── ServiceMonitor (Prometheus Operator) ────────────────────────────────────
# Requires the Prometheus Operator CRDs to be installed in the cluster.
serviceMonitor:
  enabled: false

  # Namespace to deploy the ServiceMonitor into.
  # Defaults to the release namespace.
  namespace: ""

  # Extra labels added to the ServiceMonitor metadata (e.g. to match a
  # Prometheus Operator selector: release: kube-prometheus-stack).
  additionalLabels: {}

  annotations: {}

  # How often Prometheus scrapes the metrics endpoint.
  interval: 30s

  # Per-scrape timeout; must be <= interval.
  scrapeTimeout: 10s

  # Path on which the controller exposes Prometheus metrics.
  path: /metrics

  # Propagate these Service labels to scraped metrics as target labels.
  targetLabels: []

  # Restrict scraping to services in these namespaces.
  # Leave empty to scrape from the release namespace only (default).
  namespaceSelector: {}

  # Set to true to honour labels already present on ingested samples.
  honorLabels: false

  # Set to true to honour timestamps from the target.
  honorTimestamps: true

  # http or https. Use https when the metrics endpoint is TLS-protected.
  scheme: http

  # TLS config when scheme=https.
  # Refer to: https://prometheus-operator.dev/docs/api-reference/api/#monitoring.coreos.com/v1.TLSConfig
  tlsConfig: {}

  # Secret containing a bearer token used for authentication.
  bearerTokenSecret: {}
  #  name: my-secret
  #  key: token

  # Maximum number of samples accepted within a single scrape.
  sampleLimit: 0

  # Prometheus relabeling applied to scraped targets before ingestion.
  # https://prometheus.io/docs/prometheus/latest/configuration/configuration/#relabel_config
  relabelings: []
  # - sourceLabels: [__meta_kubernetes_pod_label_app]
  #   targetLabel: app

  # Metric relabeling applied after scraping, before storage.
  metricRelabelings: []
  # - sourceLabels: [__name__]
  #   regex: go_.*
  #   action: drop

# ─── PrometheusRule (Prometheus Operator) ─────────────────────────────────────
# Creates a PrometheusRule resource with alerting rules for the MQTT bridges.
# Requires the Prometheus Operator CRDs to be installed in the cluster.
prometheusRule:
  enabled: false

  # Namespace to deploy the PrometheusRule into.
  # Defaults to the release namespace.
  namespace: ""

  # Extra labels added to the PrometheusRule metadata (e.g. to match a
  # Prometheus Operator ruleSelector: release: kube-prometheus-stack).
  additionalLabels: {}

  annotations: {}

  # Built-in alerting rules — each can be individually disabled or tuned.
  defaultRules:
    enabled: true

    # Alert when a bridge stays disconnected for too long.
    bridgeDisconnected:
      enabled: true
      for: 5m
      severity: warning
      additionalLabels: {}

    # Alert when a bridge reconnects more than ~2×/min over 10 minutes.
    # threshold is reconnects-per-second (0.033 ≈ 2/min).
    highReconnectRate:
      enabled: true
      for: 10m
      threshold: "0.033"
      severity: warning
      additionalLabels: {}

    # Alert when a connected bridge stops receiving messages.
    noMessagesReceived:
      enabled: true
      # Observation window — increase() is computed over this duration.
      window: 1h
      for: 0m
      severity: info
      additionalLabels: {}

    # Alert when p99 message-processing latency exceeds threshold (seconds).
    slowMessageProcessing:
      enabled: true
      for: 5m
      threshold: "1.0"
      severity: warning
      additionalLabels: {}

    # Alert when the controller's own scrape target disappears.
    controllerAbsent:
      enabled: true
      for: 5m
      severity: critical
      additionalLabels: {}

  # Fully custom rule groups appended after the default rules group.
  # Use standard Prometheus rule group format.
  additionalGroups: []
  # - name: my-custom-rules
  #   rules:
  #     - alert: MyAlert
  #       expr: some_metric > 0
  #       for: 1m
  #       labels:
  #         severity: info
  #       annotations:
  #         summary: "Custom alert"

# ─── RBAC ────────────────────────────────────────────────────────────────────
rbac:
  create: true

serviceAccount:
  create: true
  annotations: {}
  name: ""

# ─── Pod configuration ───────────────────────────────────────────────────────
podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# ─── CRD installation ────────────────────────────────────────────────────────
# When true, the Helm chart installs the MQTTBridge CRD.
# Set to false if you manage CRDs separately (e.g., via GitOps).
installCRDs: true
