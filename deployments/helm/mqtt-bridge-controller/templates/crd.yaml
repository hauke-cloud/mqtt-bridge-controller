{{- if .Values.installCRDs -}}
# Kept in sync with config/crd/bases/iot.hauke.cloud_mqttbridges.yaml (make manifests).
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
    helm.sh/resource-policy: keep
  name: mqttbridges.iot.hauke.cloud
  labels:
    {{- include "mqtt-bridge-controller.labels" . | nindent 4 }}
spec:
  group: iot.hauke.cloud
  names:
    kind: MQTTBridge
    listKind: MQTTBridgeList
    plural: mqttbridges
    shortNames:
    - mb
    singular: mqttbridge
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.bridgeName
      name: Bridge
      type: string
    - jsonPath: .spec.host
      name: Host
      type: string
    - jsonPath: .status.connectionState
      name: State
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated. In CamelCase.
            type: string
          metadata:
            type: object
          spec:
            properties:
              bridgeName:
                minLength: 1
                type: string
              credentialsSecretRef:
                description: Reference to a Secret containing MQTT credentials.
                  Omit entirely for anonymous brokers.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    minLength: 1
                    type: string
                  passwordKey:
                    description: Key in the Secret whose value is used as the MQTT
                      password. Defaults to "password" when empty.
                    type: string
                  usernameKey:
                    description: Key in the Secret whose value is used as the MQTT
                      username. Defaults to "username" when empty.
                    type: string
                required:
                - name
                - namespace
                type: object
              deviceType:
                allOf:
                - enum:
                  - tasmota
                  - generic
                - enum:
                  - tasmota
                  - generic
                default: tasmota
                type: string
              discoveryEnabled:
                default: false
                type: boolean
              host:
                minLength: 1
                type: string
              maxReconnectBackoffSeconds:
                default: 60
                description: Reconnect backoff cap in seconds.
                format: int32
                maximum: 300
                minimum: 5
                type: integer
              port:
                default: 1883
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              topics:
                items:
                  properties:
                    qos:
                      default: 1
                      format: int32
                      maximum: 2
                      minimum: 0
                      type: integer
                    topic:
                      minLength: 1
                      type: string
                    type:
                      allOf:
                      - enum:
                        - telemetry
                        - result
                        - state
                        - command
                      - enum:
                        - telemetry
                        - result
                        - state
                        - command
                      type: string
                  required:
                  - topic
                  - type
                  type: object
                type: array
            required:
            - bridgeName
            - host
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connectionState:
                allOf:
                - enum:
                  - connected
                  - disconnected
                  - connecting
                  - error
                - enum:
                  - connected
                  - disconnected
                  - connecting
                  - error
                type: string
              errorMessage:
                description: Human-readable error message when connectionState=error.
                type: string
              lastConnectedTime:
                format: date-time
                type: string
              lastDisconnectedTime:
                format: date-time
                type: string
              messagesReceived:
                description: Total MQTT messages received since last connect.
                format: int64
                type: integer
              reconnectCount:
                description: Number of reconnect attempts since startup.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
