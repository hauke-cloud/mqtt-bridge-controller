{{- if .Values.installCRDs -}}
# Sync from config/crd/bases/iot.hauke.cloud_mqttbridges.yaml after running `make manifests`.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
    helm.sh/resource-policy: keep
  name: mqttbridges.iot.hauke.cloud
  labels:
    {{- include "mqtt-bridge-controller.labels" . | nindent 4 }}
spec:
  group: iot.hauke.cloud
  names:
    kind: MQTTBridge
    listKind: MQTTBridgeList
    plural: mqttbridges
    shortNames:
    - mb
    singular: mqttbridge
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.bridgeName
      name: Bridge
      type: string
    - jsonPath: .spec.host
      name: Host
      type: string
    - jsonPath: .status.connectionState
      name: State
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MQTTBridge manages an MQTT broker connection and maps state into Kubernetes status.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              bridgeName:
                minLength: 1
                type: string
              credentialsSecretRef:
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                  passwordKey:
                    default: password
                    type: string
                  usernameKey:
                    default: username
                    type: string
                required:
                - name
                - namespace
                type: object
              deviceType:
                default: tasmota
                enum:
                - tasmota
                - generic
                type: string
              discoveryEnabled:
                default: false
                type: boolean
              host:
                minLength: 1
                type: string
              maxReconnectBackoffSeconds:
                default: 60
                format: int32
                maximum: 300
                minimum: 5
                type: integer
              port:
                default: 1883
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              topics:
                items:
                  properties:
                    qos:
                      default: 1
                      format: int32
                      maximum: 2
                      minimum: 0
                      type: integer
                    topic:
                      minLength: 1
                      type: string
                    type:
                      enum:
                      - telemetry
                      - result
                      - state
                      - command
                      type: string
                  required:
                  - topic
                  - type
                  type: object
                type: array
            required:
            - bridgeName
            - host
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connectionState:
                enum:
                - connected
                - disconnected
                - connecting
                - error
                type: string
              errorMessage:
                type: string
              lastConnectedTime:
                format: date-time
                type: string
              lastDisconnectedTime:
                format: date-time
                type: string
              messagesReceived:
                format: int64
                type: integer
              reconnectCount:
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
