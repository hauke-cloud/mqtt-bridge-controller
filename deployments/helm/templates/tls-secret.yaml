{{- if and .Values.tls.enabled (not .Values.tls.existingSecret) -}}
{{- if or .Values.tls.crt .Values.tls.key .Values.tls.ca -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mqtt-bridge-controller.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mqtt-bridge-controller.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.crt | quote }}
  tls.key: {{ .Values.tls.key | quote }}
  ca.crt: {{ .Values.tls.ca | quote }}
{{- end }}
{{- end }}
